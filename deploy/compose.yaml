# Services for the Lime Green assistant, run with Docker Engine (and Docker Compose).
#
# From the repository root, inside the Ubuntu WSL distribution or on the Linux server:
#
#   docker compose -f deploy/compose.yaml --profile dev up -d
#   docker compose -f deploy/compose.yaml --profile observability up -d   # traces, metrics
#
# Settings come from deploy/.env: copy deploy/.env.example and set a password. The
# file is git-ignored. Every service has a memory limit, so the stack fits beside the
# model servers on the laptop (plan §6b).

name: limegreen

services:
  postgres:
    profiles: [dev]
    # The pgvector image plus pg_textsearch for BM25 ranking (deploy/postgres/Dockerfile).
    build: postgres
    image: limegreen-postgres:0.8.6-pg18-trixie-textsearch1.4.0
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_textsearch
      # BM25 index memory, kept inside the container's 512 MB (the default is 2 GB).
      - -c
      - pg_textsearch.memory_limit=128MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # This machine only. WSL forwards it to Windows localhost; the network never sees it.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    profiles: [dev]
    image: ghcr.io/amacneil/dbmate:2.36.0
    command: ["up"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      # A schema dump needs pg_dump from the same major version as the server, and a
      # mismatch fails silently; the migrations themselves are the schema history.
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ../db:/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m

  # Traces from the API over OTLP/HTTP, with a built-in UI at
  # http://localhost:10428/select/vmui. Spans older than 7 days (the default) are dropped.
  victoria-traces:
    profiles: [observability]
    image: victoriametrics/victoria-traces:v0.11.1
    command: ["-storageDataPath=/victoria-traces-data"]
    ports:
      - "127.0.0.1:10428:10428"
    volumes:
      - traces:/victoria-traces-data
    # Its caches take 60% of this limit, which it reads from the container.
    mem_limit: 256m
    restart: unless-stopped

  # Metrics from the API over OTLP/HTTP, with a built-in UI at http://localhost:8428/vmui.
  # Samples older than 1 month (the default) are dropped. Prometheus-style names
  # (gen_ai_client_operation_duration_seconds) keep queries plain.
  victoria-metrics:
    profiles: [observability]
    image: victoriametrics/victoria-metrics:v1.152.0
    command:
      - -storageDataPath=/victoria-metrics-data
      - -opentelemetry.usePrometheusNaming
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - metrics:/victoria-metrics-data
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pgdata:
  traces:
  metrics:
