[project]
name = "limespec"
version = "0.1.0"
description = "A local LLM assistant that answers questions from Lime Green website pages and shows its sources."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nduka Nwagbo", email = "nwagbondukajr@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.52.4",
]

[project.scripts]
limespec = "limespec.cli:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=limespec --cov-report=term-missing --cov-fail-under=100 -m 'not live'"
markers = ["live: needs the running llama.cpp servers and a built index"]

[dependency-groups]
dev = [
    # FastAPI's test client (Starlette) needs httpx2; the application uses httpx.
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.5.5",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
]
